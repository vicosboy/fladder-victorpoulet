<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/nas/">

  <meta charset="UTF-8" />
  <meta content="IE=Edge" http-equiv="X-UA-Compatible" />
  <meta name="description" content="Vidéothèque personnelle." />

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="NAS">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="cinema-icon.svg"/>

  <title>NAS</title>
  <link rel="manifest" href="manifest.json">
  <style>
    :root {
      color-scheme: light;
      background: #fbf9f6;
    }

    html,
    body {
      height: 100%;
      margin: 0;
      background: #fbf9f6;
    }

    #fladder-loading {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: grid;
      place-items: center;
      background: #fbf9f6;
      color: #201f1d;
      transition: opacity 180ms ease;
    }

    #fladder-loading.is-ready {
      opacity: 0;
      pointer-events: none;
    }

    .fladder-loading__content {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 22px;
    }

    .fladder-loading__brand {
      color: #956018;
      font: 700 30px/1 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      letter-spacing: 0.28em;
      padding-left: 0.28em;
    }

    .fladder-loading__bar {
      width: min(190px, 48vw);
      height: 3px;
      overflow: hidden;
      border-radius: 99px;
      background: #e8e2da;
    }

    .fladder-loading__bar::after {
      display: block;
      width: 45%;
      height: 100%;
      border-radius: inherit;
      background: #956018;
      content: "";
      animation: fladder-loading 1.2s ease-in-out infinite;
    }

    @keyframes fladder-loading {
      from { transform: translateX(-110%); }
      to { transform: translateX(245%); }
    }

    @media (prefers-reduced-motion: reduce) {
      .fladder-loading__bar::after { animation-duration: 2.4s; }
    }
  </style>
</head>
<body>
  <div id="fladder-loading" role="status" aria-label="Chargement">
    <div class="fladder-loading__content">
      <div class="fladder-loading__brand">
        NAS
      </div>
      <div class="fladder-loading__bar" aria-hidden="true"></div>
    </div>
  </div>
  <script>
    window.addEventListener("flutter-first-frame", function () {
      const loading = document.getElementById("fladder-loading");
      if (!loading) return;
      loading.classList.add("is-ready");
      window.setTimeout(() => loading.remove(), 220);
    }, { once: true });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
